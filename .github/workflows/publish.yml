name: publish

# Publishes @tappass/dsh-governance to npm when a version tag is pushed.
#   npm version patch && git push --follow-tags
#
# Requires a repo secret NPM_TOKEN: an npm granular access token with
# read/write on the @tappass scope and "bypass 2FA" enabled.

on:
  push:
    tags: ['v*']

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # npm provenance
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: 'https://registry.npmjs.org'
      - run: npm install --no-audit --no-fund --legacy-peer-deps
      - run: npm run build
      - run: npm test
      - run: npm run proof
      - run: npm publish --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
